# tana - private S3 object store and WordPress uploads agent.
#
# Read at startup and hot-reloaded on change; never rewritten by the
# daemon. Most fields have a production default, but tana cannot
# invent credentials for you: roles is empty below, and the daemon
# will refuse to start until you fill in the section you need.
#
# Generate a key pair with:  tana --keygen

# What this machine runs.
#   [store]         a storage box: owns the blobs, speaks S3
#   [agent]         a web server: FUSE mount, cache, writeback
#   [store, agent]  a single box doing both
#
# Both roles on one machine is the ordinary way to start: everything
# works, the agent simply talks to 127.0.0.1 instead of another host.
# The store and the agent share this machine's index file, and their
# namespaces are kept apart by role — a site may safely be named after
# its own bucket. See the single-server example at the bottom.
roles: []


# ---------------------------------------------------------------- store
store:
  # Root of the blob store. Blobs live under data/blobs/ab/cd/<sha256>,
  # the journal under data/journal. Put it on the volume with the
  # space; tana does no RAID and no erasure coding of its own, so the
  # redundancy below this path is ZFS's or mdraid's job.
  data: /srv/tana

  # S3 API address. Bind it to the private interface: nothing in tana's
  # threat model expects the raw store to face the internet.
  listen: 127.0.0.1:9200

  # Region name returned by the API and expected in the sigv4
  # credential scope. Arbitrary, but agents must use the same value.
  region: tana

  # One bucket per site, each with its own credentials. An agent can
  # only touch the bucket whose keys it holds.
  buckets: []
  # buckets:
  #   - name: shop-uploads
  #     access_key: "..."
  #     secret_key: "..."
  #     # Allow unauthenticated GET and HEAD. A WordPress media library
  #     # is public by definition — the same files a browser would have
  #     # fetched from wp-content/uploads — and this is what lets a CDN
  #     # or a reverse proxy sit in front of the store. Writes always
  #     # need a signature; listing is never anonymous.
  #     public_read: true
  #     # Keys excluded from public_read however it is set. This is
  #     # where woocommerce_uploads belongs: those are paid downloads,
  #     # they live in the same bucket as the media, and the rule that
  #     # keeps them private has to be here rather than in a plugin
  #     # somebody can switch off from wp-admin. They stay reachable
  #     # through presigned links.
  #     protected:
  #       - "woocommerce_uploads/**"

  gc:
    # How often to sweep blobs that lost their last reference.
    interval: 6h
    # How long such a blob is kept anyway. This grace period is what
    # makes an accidental mass delete recoverable, so do not set it to
    # zero because the disk looks full.
    grace: 72h

  replica:
    # off | primary | secondary. Replication ships the journal that is
    # already written for crash recovery, rather than adding a second
    # mechanism to get wrong. Quoted because bare off is a YAML boolean.
    mode: "off"
    # Shared key between primary and secondaries. Not sigv4:
    # replication is not a tenant operation, it exposes every bucket,
    # and the peer holding the key is your own second machine. Put it
    # on a private network. Generate one with: tana --keygen
    secret: ""
    # Secondaries expected to pull. Informational: the primary keeps
    # no per-peer state, so it cannot drift from what a peer holds.
    peers: []
    # Primary a secondary pulls from.
    from: ""
    # How often a secondary pulls.
    interval: 10s


# ---------------------------------------------------------------- agent
agent:
  sites: []
  # sites:
  #   - name: shop.example.com
  #
  #     # The path WordPress knows: this becomes the FUSE mountpoint.
  #     uploads: /home/user/public_html/wp-content/uploads
  #
  #     # Where the real files live. Keep it a plain directory on the
  #     # same filesystem you would have used anyway: if tana ever dies,
  #     # `mount --bind` this over uploads and the site is back, minus
  #     # whatever had been evicted.
  #     backing: /var/lib/tana/shop
  #
  #     cache:
  #       # Ceiling for the backing store. Omit for no limit (mirror
  #       # everything, evict nothing).
  #       max_size: 20GB
  #       # Keep evicting while the filesystem has less than this free,
  #       # whatever max_size says.
  #       min_free: 5GB
  #       # Never evict objects smaller than this. Thumbnails are what
  #       # plugins stat and read constantly and they cost nothing to
  #       # keep; evicting them buys no space and hurts every request.
  #       keep_below: 64KB
  #       # Glob patterns, relative to uploads, pinned by policy. A
  #       # trailing /** covers a directory and everything under it.
  #       never_evict:
  #         - "woocommerce_uploads/**"
  #       # How often an eviction pass runs.
  #       interval: 1m
  #
  #     mount:
  #       # Let php-fpm and the web server reach the mount. Needed
  #       # whenever tana does not run as them, which is almost always.
  #       allow_other: true
  #       # Reads by THIS user pull an evicted object back onto local
  #       # disk. Reads by anyone else — public traffic arriving through
  #       # the web server — are streamed from the store instead.
  #       # Without it, a crawler walking the 2019 archive refills the
  #       # cache with exactly the objects that were evicted for being
  #       # cold. Accepts a name or a numeric uid; empty means every
  #       # read populates.
  #       populate_user: "www-data"
  #
  #     backend:
  #       endpoint: http://store01.lan:9200
  #       bucket: shop-uploads
  #       access_key: "..."
  #       secret_key: "..."
  #       # remote: acknowledge a write only once the store has it on
  #       #         disk. Slower and true.
  #       # local:  acknowledge as soon as it is in the backing store,
  #       #         with the upload still queued. Faster, and a lie if
  #       #         the machine dies before the queue drains.
  #       ack: remote


# ------------------------------------------------------- single server
#
# Everything on one machine, which is where most deployments start and
# where all of them should be tested first. Copy this over the sections
# above, fill in the keys from `tana --keygen`, and adjust the paths.
#
# roles: [store, agent]
#
# store:
#   data: /srv/tana
#   listen: 127.0.0.1:9200
#   buckets:
#     - name: shop-uploads
#       access_key: "TANA..."
#       secret_key: "..."
#       public_read: true
#       protected:
#         - "woocommerce_uploads/**"
#
# agent:
#   sites:
#     - name: shop.example.com
#       uploads: /home/user/public_html/wp-content/uploads
#       backing: /var/lib/tana/shop
#       cache:
#         # On one machine the bytes exist twice while an object is
#         # cached: once in the backing store, once as a blob. Eviction
#         # still halves that, but a ceiling here buys less than it does
#         # when the store is on another host. Leave it out at first.
#         max_size: 20GB
#       mount:
#         allow_other: true
#         populate_user: "www-data"
#       backend:
#         # The store is right here. Loopback, not the LAN address:
#         # nothing else needs to reach it.
#         endpoint: http://127.0.0.1:9200
#         bucket: shop-uploads
#         access_key: "TANA..."   # the same pair as above
#         secret_key: "..."
#         ack: remote
