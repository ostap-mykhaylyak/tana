name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -s -l .)"
      - name: go vet
        run: go vet ./...
      - name: test
        run: go test ./... -race -count=1

  build:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' -o bin/tana-${{ matrix.goarch }} ./cmd/tana

  # tana is deployed only on linux/amd64 and linux/arm64, but the repo
  # must keep building on a workstation: the store role and every test
  # run there, and a build break off Linux is a break in the dev loop.
  crossbuild:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: build for a non-Linux workstation
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
