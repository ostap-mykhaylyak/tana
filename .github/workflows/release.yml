name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o tana ./cmd/tana
      - name: package
        run: |
          BUNDLE=tana-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir "$BUNDLE"
          # The binary self-provisions on first run (tana --init): the
          # bundle only ships binary + unit + docs.
          cp tana internal/bootstrap/tana.service README.md LICENSE "$BUNDLE"/
          tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
          sha256sum "$BUNDLE.tar.gz" > "$BUNDLE.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tana-*.tar.gz
            tana-*.tar.gz.sha256
          if-no-files-found: error

  # A single release job creates the GitHub release once, after both
  # builds finish — avoids the race where two matrix jobs try to create
  # the same release concurrently.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the annotated tag object is present: its
      # message is the release notes, written once when the tag is
      # created instead of twice in two places that drift apart.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: release notes from the tag annotation
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > NOTES.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: NOTES.md
          files: |
            dist/tana-*.tar.gz
            dist/tana-*.tar.gz.sha256
